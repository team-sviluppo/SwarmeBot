# The iOS app (docs/plans/2026-10-22-app-ios.md). The Xcode project is
# generated and git-ignored: run `xcodegen` in this folder, then open
# SwarmeBot-iOS.xcodeproj or build with
#   xcodebuild -project iOS/SwarmeBot-iOS.xcodeproj -scheme SwarmeBot-iOS \
#     -destination 'platform=iOS Simulator,name=iPhone 17' build
# Signing for a device: put DEVELOPMENT_TEAM in iOS/Local.xcconfig (git-ignored).
name: SwarmeBot-iOS
options:
  bundleIdPrefix: it.hextra
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Shared.xcconfig
  Release: Shared.xcconfig
packages:
  SwarmeBot:
    path: ..
  # Gemma on the phone (plan §4.4): the versions phase 0 measured, iOS app only
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.13.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SwarmeBot-iOS:
    type: application
    platform: iOS
    sources:
      - path: SwarmeBot
      # the Mac app's mascots, the same files (not copies)
      - path: ../Sources/SwarmeBot/Mascot/SwarmeAvatar.swift
      - path: ../Sources/SwarmeBot/Mascot/SwarmeFaceData.swift
      - path: ../Sources/SwarmeBot/Mascot/SwarmeModel.swift
      - path: ../Sources/SwarmeBot/Mascot/MascotState.swift
    dependencies:
      - package: SwarmeBot
        product: AgentCore
      - package: SwarmeBot
        product: CompanionCore
      - package: SwarmeBot
        product: SwarmeL10n
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
    entitlements:
      path: SwarmeBot/SwarmeBot.entitlements
      properties:
        # Gemma's peak is about 5 GiB (plan §13, phase 0)
        com.apple.developer.kernel.increased-memory-limit: true
        # development signing; a distribution build is signed with production (PushManager.environment)
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SWARMEBOT_BUNDLE_ID)
        PRODUCT_NAME: SwarmeBot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwarmeBot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: "SwarmeBot usa la fotocamera per leggere il QR di abbinamento e per le foto da allegare."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SwarmeBot riceve dal Mac, sulla rete locale, la configurazione dei bot del telefono."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    info:
      path: SwarmeBot/Info.plist
      properties:
        # the build settings' versions, which xcodegen would otherwise write as 1.0 / 1
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # what the phone bots' tools and dictation use (PhoneTools.swift, Dictation.swift)
        NSCalendarsFullAccessUsageDescription: "I bot del telefono leggono gli appuntamenti e, se lo confermi, ne aggiungono."
        NSRemindersFullAccessUsageDescription: "I bot del telefono leggono i promemoria e, se lo confermi, ne aggiungono."
        NSContactsUsageDescription: "I bot del telefono cercano numeri ed email nella rubrica quando glielo chiedi."
        NSAlarmKitUsageDescription: "I bot del telefono impostano sveglie e timer, se lo confermi."
        NSMicrophoneUsageDescription: "SwarmeBot usa il microfono per la dettatura: la voce diventa testo sul telefono."
        NSSpeechRecognitionUsageDescription: "SwarmeBot trascrive sul telefono quello che detti."
        # endpoints and test engines on the local network may be plain HTTP (plan §8)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # pushes are off unless the build names its relay (iOS/Local.xcconfig)
        SwarmeBotPushRelay: $(SWARMEBOT_PUSH_RELAY)
        # `fetch`: the app refresh that checks the servers' bots with the app closed (Notifier)
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [it.hextra.swarmebot.refresh]
        # settings exported from the Mac (plan §7)
        CFBundleDocumentTypes:
          - CFBundleTypeName: SwarmeBot configuration
            LSHandlerRank: Owner
            LSItemContentTypes: [it.hextra.swarmebot.phone-config]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: it.hextra.swarmebot.phone-config
            UTTypeDescription: SwarmeBot configuration
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [swarmeconfig]
        CFBundleURLTypes:
          - CFBundleURLName: $(SWARMEBOT_BUNDLE_ID)
            CFBundleURLSchemes: [swarmebot]
  SwarmeBot-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwarmeBotTests
    dependencies:
      - target: SwarmeBot-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwarmeBot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SwarmeBot"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SwarmeBot-iOS:
    build:
      targets:
        SwarmeBot-iOS: all
        SwarmeBot-iOSTests: [test]
    test:
      targets:
        - SwarmeBot-iOSTests
  # the app as people will use it: optimized, no debugger attached (a debug
  # build under Xcode's debugger is far slower on a device, MLX above all)
  SwarmeBot-iOS Release:
    build:
      targets:
        SwarmeBot-iOS: all
    run:
      config: Release
      debugEnabled: false
    profile:
      config: Release
    archive:
      config: Release
